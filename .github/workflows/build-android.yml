name: Build Android APK

on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JS dependencies
        working-directory: SkinCheckApp
        run: npm install

      - name: Make gradlew executable
        working-directory: SkinCheckApp/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: SkinCheckApp/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: skin-check-debug-apk
          path: SkinCheckApp/android/app/build/outputs/apk/debug/app-debug.apk
